<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Snake Castles</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f1a">
<link rel="icon" href="icon-192.png">
<style>
:root{--fg:#fff;--panel:rgba(10,12,24,.88);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,sans-serif;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
body{background:#0d0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:background 1s}
#top{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:0 8px}
canvas{border-radius:12px;box-shadow:0 0 30px rgba(0,0,0,.6)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#box{background:var(--panel);padding:24px;border-radius:16px;text-align:center;max-width:330px;margin:12px}
h1{margin:0 0 8px;font-size:25px}p{margin:6px 0 14px;opacity:.88;font-size:14px;line-height:1.4}
button{font:inherit;font-weight:700;padding:10px 20px;margin:4px;border:0;border-radius:10px;background:#ffd34d;color:#222;cursor:pointer}
#mb{padding:2px 8px;margin:0;background:#ffffff33;color:#fff}
</style></head><body>
<div id="top"><span id="hs"></span><button id="mb">🔊</button></div>
<canvas id="c"></canvas>
<div id="ov"><div id="box"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
// name, hue, castle emoji, fruits, poison (shrinks), skull (kills)
const C=[
["Meadow Keep",120,"🏰",["🍎","🍐","🍒"],"🍄","💀"],
["Ember Fort",14,"🌋",["🍊","🍑","🍅"],"🧪","☠️"],
["Frost Citadel",195,"🧊",["🫐","🍇","🍏"],"🥶","💀"],
["Sunset Palace",32,"🕌",["🍍","🥭","🍋"],"🍄","☠️"],
["Jungle Temple",145,"🛕",["🥝","🍌","🍈"],"🦂","💀"],
["Ocean Spire",205,"🗼",["🍉","🍓","🍒"],"🐡","☠️"],
["Crystal Cave",285,"💎",["🍇","🫐","🍆"],"🧪","💀"],
["Desert Kingdom",45,"🏜️",["🍯","🥭","🍋"],"🦂","☠️"],
["Cloud Castle",215,"☁️",["🍑","🍐","🍏"],"⚡","💀"],
["Haunted Manor",265,"🏚️",["🍇","🍎","🫐"],"🕸️","☠️"],
["Candy Palace",330,"🍭",["🍓","🍬","🍒"],"🧁","💀"],
["Neon City",170,"🌃",["🍏","🥝","🍈"],"🔋","☠️"],
["Volcano Throne",5,"🔥",["🌶️","🍅","🍊"],"💣","💀"],
["Pirate Bay",190,"🏴‍☠️",["🍍","🥥","🍌"],"🦈","☠️"],
["Samurai Dojo",350,"⛩️",["🍑","🍡","🍙"],"🗡️","💀"],
["Space Station",235,"🚀",["🫐","🍇","🍐"],"👾","☠️"],
["Dragon Lair",100,"🐉",["🍏","🥝","🍈"],"🔥","💀"],
["Royal Garden",300,"🌹",["🍓","🍑","🍒"],"🥀","☠️"],
["Shadow Fortress",255,"🦇",["🍇","🫐","🍆"],"🕷️","💀"],
["Golden Castle",50,"👑",["🍋","🍍","🍯"],"💣","☠️"]];
const SZ=[20,17,14,12,10];
let ci=0,li=0,N=20,cell=20,B=400,sn,dir,q=[],items=[],eaten=0,goal=5,lives=3,score=0,st='menu',acc=0,last=0,tick=0,muted=false,flash=0,shake=0,step_=0;
const sv=()=>{try{return JSON.parse(localStorage.snk||'{}')}catch(e){return{}}};
const save=()=>{try{localStorage.snk=JSON.stringify({ci})}catch(e){}};

// ---------- audio (synthesized, no files needed) ----------
let ac,mg;
function A(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination)}if(ac.state=='suspended')ac.resume()}catch(e){}}
function tone(f,d,type='square',v=.12,t0=0,sl){if(!ac)return;const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d)}
const mf=n=>440*2**((n-69)/12);
function sfx(k){if(!ac||muted)return;({eat:()=>{tone(660,.08,'square',.1,0,990);tone(990,.1,'square',.08,.07)},hurt:()=>tone(300,.3,'sawtooth',.15,0,80),die:()=>{tone(400,.5,'sawtooth',.15,0,50);tone(200,.6,'square',.1,.1,40)},up:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.1))})[k]()}
// music: bass + arpeggio loop; scale, key and tempo change every castle
function mus(){setTimeout(mus,60000/(105+ci*3)/2);if(!ac||muted||st!='play')return;
const sc=ci%2?[0,3,5,7,10]:[0,2,4,7,9],r=43+ci%12,b=(step_>>3)%4,c=[0,5,3,7][b],s=step_++%8;
if(s%4==0)tone(120,.12,'sine',.25,0,40);
if(s%2==0)tone(mf(r+c),.22,'triangle',.2);
tone(mf(r+24+c+sc[(s*2+b)%5]),.14,'square',.04);
if(s==4)tone(mf(r+12+c),.3,'sine',.1)}
mus();
$('mb').onclick=()=>{muted=!muted;$('mb').textContent=muted?'🔇':'🔊';A()};

// ---------- game ----------
function fit(){const s=Math.floor(Math.min(innerWidth-16,innerHeight-90,560)),d=devicePixelRatio||1;cv.style.width=cv.style.height=s+'px';cv.width=cv.height=s*d;B=s*d;cell=B/N}
addEventListener('resize',fit);
function hue(){const h=C[ci][1];document.body.style.background=`radial-gradient(circle at 50% 30%,hsl(${h},45%,18%),hsl(${h},50%,6%))`}
function hud(){const t=C[ci];$('hs').textContent=`${t[2]} ${t[0]} ${ci+1}/20 · Lv ${li+1}/5 · ${t[3][0]} ${eaten}/${goal} · ❤️${lives} · ⭐${score}`}
function lvl(){N=SZ[li];goal=5+li*2;eaten=0;fit();const m=N>>1;sn=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];dir={x:1,y:0};q=[];items=[];spawn('f');hue();hud()}
function free(){for(let i=0;i<300;i++){const p={x:Math.random()*N|0,y:Math.random()*N|0};if(!sn.some(s=>s.x==p.x&&s.y==p.y)&&!items.some(s=>s.x==p.x&&s.y==p.y)&&!(p.y==sn[0].y&&p.x>sn[0].x&&p.x<sn[0].x+4))return p}}
function spawn(k){const p=free();if(!p)return;const t=C[ci];p.k=k;p.e=k=='f'?t[3][Math.random()*3|0]:k=='p'?t[4]:t[5];p.ttl=k=='f'?9999:70;items.push(p)}
function ov(t,s,b,f){$('box').innerHTML=`<h1>${t}</h1><p>${s}</p><button id="ob">${b}</button>`;$('ob').onclick=f;$('ov').style.display='flex'}
function go(){$('ov').style.display='none';A();lvl();st='play'}
function menu(){const s=sv();st='menu';$('box').innerHTML=`<h1>🐍 Snake Castles</h1><p>Swipe or use arrow keys / WASD. Space pauses.<br>Fruit grows you · poison 🍄 shrinks you · skulls 💀 kill.<br>Each castle has 5 levels, and the arena keeps shrinking. 20 castles await!</p><button id="pb">Play</button>${s.ci?`<button id="cb">Continue: Castle ${s.ci+1}</button>`:''}`;
$('pb').onclick=()=>{ci=0;li=0;lives=3;score=0;go()};if(s.ci)$('cb').onclick=()=>{ci=s.ci;li=0;lives=3;score=0;go()};$('ov').style.display='flex'}
function die(){sfx('die');lives--;shake=14;hud();
if(lives<=0){st='over';ov('Game Over 💀',`Castle ${ci+1} · Score ${score}`,'Retry castle',()=>{lives=3;score=0;li=0;go()})}
else{st='msg';ov('Ouch! 💥',`${lives} ${lives>1?'lives':'life'} left`,'Retry level',go)}}
function win(){sfx('up');li++;
if(li>4){li=0;ci++;
if(ci>19){ci=0;st='over';ov('👑 You conquered all 20 castles!',`Final score ${score}`,'Play again',()=>{score=0;lives=3;go()});return}
save();lives=Math.min(lives+1,5);st='msg';ov('🏰 Castle conquered!',`Welcome to ${C[ci][0]}.<br>New colors, new foods, new dangers! (+1 life)`,'Enter',go)}
else{st='msg';ov('Level cleared! ⭐',`Next: a smaller ${SZ[li]}×${SZ[li]} arena`,'Next level',go)}}
function step(){tick++;if(q.length)dir=q.shift();
const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some((s,i)=>i<sn.length-1&&s.x==h.x&&s.y==h.y))return die();
sn.unshift(h);const i=items.findIndex(o=>o.x==h.x&&o.y==h.y);let pop=1;
if(i>=0){const o=items.splice(i,1)[0];
if(o.k=='f'){pop=0;eaten++;score+=10*(li+1);sfx('eat');spawn('f');if(eaten>=goal){hud();return win()}}
else if(o.k=='p'){pop=3;sfx('hurt');flash=10}
else return die()}
while(pop--)sn.pop();
if(sn.length<3)return die();
items.forEach(o=>o.ttl--);items=items.filter(o=>o.ttl>0);
if(tick%22==0&&items.filter(o=>o.k!='f').length<(2+(ci>>2)+(li>>1)))spawn(Math.random()<.3+ci*.02?'s':'p');
hud()}
function turn(dx,dy){if(st!='play')return;const l=q.length?q[q.length-1]:dir;if((l.x==-dx&&l.y==-dy)||(l.x==dx&&l.y==dy))return;if(q.length<2)q.push({x:dx,y:dy})}
function pause(){if(st=='play'){st='pause';ov('Paused','','Resume',()=>{$('ov').style.display='none';st='play'})}}
addEventListener('keydown',e=>{const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(k){turn(...k);e.preventDefault()}if(e.key==' '||e.key=='p'){pause();e.preventDefault()}});
let tx=null,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(tx==null)return;const p=e.touches[0],dx=p.clientX-tx,dy=p.clientY-ty;if(Math.hypot(dx,dy)>22){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));tx=p.clientX;ty=p.clientY}},{passive:true});
addEventListener('touchend',()=>tx=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

function draw(now){const h=C[ci][1],g=cell;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,B,B);
if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}
for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=`hsl(${h},35%,${(i+j)%2?13:16}%)`;x.fillRect(i*g,j*g,g+1,g+1)}
x.textAlign='center';x.textBaseline='middle';x.globalAlpha=.12;x.font=B*.6+'px serif';x.fillText(C[ci][2],B/2,B/2);x.globalAlpha=1;
x.strokeStyle=`hsl(${h},80%,55%)`;x.lineWidth=4;x.strokeRect(2,2,B-4,B-4);
x.font=g*.78+'px serif';
items.forEach(o=>{if(o.ttl<20&&o.ttl%2)return;const s=1+Math.sin(now/150+o.x+o.y)*.08;x.save();x.translate((o.x+.5)*g,(o.y+.55)*g);x.scale(s,s);
if(o.k!='f'){x.shadowColor='#f33';x.shadowBlur=g*.5}x.fillText(o.e,0,0);x.restore()});
sn.forEach((s,i)=>{x.fillStyle=`hsl(${(h+i*4)%360},80%,${Math.max(30,58-i)}%)`;x.beginPath();x.roundRect(s.x*g+g*.06,s.y*g+g*.06,g*.88,g*.88,g*(i?.3:.4));x.fill()});
const hd=sn[0],px=-dir.y,py=dir.x;
[-1,1].forEach(e=>{const cx=(hd.x+.5+dir.x*.18+px*e*.2)*g,cy=(hd.y+.5+dir.y*.18+py*e*.2)*g;x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,g*.13,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(cx+dir.x*g*.04,cy+dir.y*g*.04,g*.06,0,7);x.fill()});
if(flash>0){x.fillStyle=`rgba(255,0,0,${flash/25})`;x.fillRect(0,0,B,B);flash--}}
function loop(t){requestAnimationFrame(loop);const d=Math.min(t-last,100);last=t;
if(st=='play'){acc+=d;const sp=Math.max(65,165-li*10-ci*3);while(acc>=sp){acc-=sp;if(st=='play')step()}}
draw(t)}
lvl();menu();requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
